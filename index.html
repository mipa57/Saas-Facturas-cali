<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Facturas Cali</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #00e676;
    --verde-oscuro: #00c853;
    --fondo: #0a0f0a;
    --superficie: #111811;
    --borde: #1e2e1e;
    --texto: #e8f5e9;
    --texto-dim: #66bb6a;
    --rojo: #ff5252;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--mono);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--borde) 1px, transparent 1px),
      linear-gradient(90deg, var(--borde) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── PANTALLA LOGIN ── */
  #pantalla-auth {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fondo);
  }

  .auth-caja {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 24px;
  }

  .auth-logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -1px;
    color: var(--verde);
    margin-bottom: 8px;
  }

  .auth-sub {
    font-size: 11px;
    color: var(--texto-dim);
    margin-bottom: 32px;
    letter-spacing: 1px;
  }

  .auth-tabs {
    display: flex;
    gap: 1px;
    background: var(--borde);
    border-radius: 4px 4px 0 0;
    overflow: hidden;
    margin-bottom: 0;
  }

  .auth-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--superficie);
    color: var(--texto-dim);
    border: none;
    transition: all 0.15s;
  }

  .auth-tab.activo {
    background: var(--verde);
    color: #000;
    font-weight: 600;
  }

  .auth-form {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .auth-form input {
    background: var(--fondo);
    border: 1px solid var(--borde);
    color: var(--texto);
    font-family: var(--mono);
    font-size: 13px;
    padding: 11px 14px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .auth-form input::placeholder { color: #2d4a2d; }
  .auth-form input:focus { border-color: var(--verde); }

  .btn-auth {
    background: var(--verde);
    color: #000;
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 12px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
  }

  .btn-auth:hover { background: var(--verde-oscuro); }
  .btn-auth:disabled { background: var(--borde); color: #2d4a2d; cursor: not-allowed; }

  .auth-error {
    display: none;
    font-size: 12px;
    color: var(--rojo);
    padding: 10px 12px;
    background: rgba(255,82,82,0.08);
    border: 1px solid rgba(255,82,82,0.2);
    border-radius: 3px;
    line-height: 1.6;
  }

  .auth-error.visible { display: block; }

  /* ── APP PRINCIPAL ── */
  #pantalla-app {
    display: none;
    position: relative;
    z-index: 1;
  }

  .contenedor {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--borde);
    padding-bottom: 24px;
  }

  .logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -1px;
    color: var(--verde);
  }

  .version {
    font-size: 11px;
    color: var(--texto-dim);
    background: var(--borde);
    padding: 2px 8px;
    border-radius: 2px;
  }

  .info-usuario {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--texto-dim);
  }

  .btn-salir {
    background: none;
    border: 1px solid var(--borde);
    color: var(--texto-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .btn-salir:hover { border-color: var(--rojo); color: var(--rojo); }

  .seccion { margin-bottom: 48px; }

  .etiqueta {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--texto-dim);
    margin-bottom: 16px;
  }

  /* Zona carga */
  .zona-carga {
    border: 1px dashed var(--borde);
    border-radius: 4px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--superficie);
    position: relative;
  }

  .zona-carga input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .zona-carga:hover, .zona-carga.arrastrar {
    border-color: var(--verde);
    background: rgba(0,230,118,0.04);
  }

  .icono-carga { font-size: 32px; margin-bottom: 12px; display: block; }

  .texto-carga {
    font-size: 13px;
    color: var(--texto-dim);
    line-height: 1.8;
  }

  .texto-carga strong { color: var(--verde); }

  .fila-accion {
    margin-top: 16px;
    display: flex;
    gap: 12px;
  }

  .btn-procesar {
    background: var(--verde);
    color: #000;
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 10px 24px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .btn-procesar:hover    { background: var(--verde-oscuro); }
  .btn-procesar:disabled { background: var(--borde); color: #2d4a2d; cursor: not-allowed; }

  .archivo-chip {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 8px 12px;
    background: rgba(0,230,118,0.06);
    border: 1px solid rgba(0,230,118,0.2);
    border-radius: 3px;
    font-size: 12px;
    color: var(--verde);
  }
  .archivo-chip.visible { display: flex; }

  .barra { display: none; height: 2px; background: var(--borde); border-radius: 1px; margin-top: 16px; overflow: hidden; }
  .barra.visible { display: block; }
  .barra-inner { height: 100%; background: var(--verde); animation: cargando 1.4s ease-in-out infinite; }

  @keyframes cargando {
    0%   { width: 0%;  margin-left: 0%; }
    50%  { width: 60%; margin-left: 20%; }
    100% { width: 0%;  margin-left: 100%; }
  }

  .resultado { display: none; margin-top: 24px; border: 1px solid var(--borde); border-radius: 4px; overflow: hidden; }
  .resultado.visible { display: block; }

  .resultado-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--superficie);
    border-bottom: 1px solid var(--borde);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texto-dim);
  }

  .badge { padding: 3px 10px; border-radius: 2px; font-size: 10px; letter-spacing: 1px; }
  .badge.ok  { background: rgba(0,230,118,0.15); color: var(--verde); }

  .resultado-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .dato { display: flex; flex-direction: column; gap: 4px; }
  .dato label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #2d6a2d; }
  .dato .val { font-size: 14px; color: var(--texto); font-weight: 600; }
  .dato .val.total { font-family: var(--sans); font-size: 22px; font-weight: 700; color: var(--verde); }
  .dato .val.ok  { color: var(--verde); }
  .dato .val.mal { color: var(--rojo); }
  .dato.full { grid-column: 1 / -1; }

  .error-msg { display: none; margin-top: 16px; padding: 12px 16px; background: rgba(255,82,82,0.08); border: 1px solid rgba(255,82,82,0.25); border-radius: 3px; font-size: 12px; color: var(--rojo); line-height: 1.6; }
  .error-msg.visible { display: block; }

  /* Lista facturas */
  .cabecera-lista { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

  .btn-recargar { background: none; border: 1px solid var(--borde); color: var(--texto-dim); font-family: var(--mono); font-size: 11px; padding: 6px 14px; border-radius: 3px; cursor: pointer; transition: all 0.15s; }
  .btn-recargar:hover { border-color: var(--verde); color: var(--verde); }

  .lista { display: flex; flex-direction: column; gap: 1px; background: var(--borde); border: 1px solid var(--borde); border-radius: 4px; overflow: hidden; }

  .fila { display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr; gap: 16px; align-items: center; padding: 14px 16px; background: var(--superficie); font-size: 12px; transition: background 0.1s; }
  .fila:hover { background: rgba(0,230,118,0.03); }
  .fila.cabecera { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #2d6a2d; background: var(--fondo); pointer-events: none; }

  .fila .proveedor { font-weight: 600; }
  .fila .nit       { color: var(--texto-dim); font-size: 11px; }
  .fila .monto     { color: var(--verde); font-weight: 600; text-align: right; }
  .fila .fecha     { color: #2d6a2d; font-size: 11px; }

  .vacio { padding: 40px; text-align: center; font-size: 12px; color: #2d4a2d; }

  footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--borde); font-size: 10px; color: #2d4a2d; display: flex; justify-content: space-between; }

  @media (max-width: 600px) {
    .resultado-body { grid-template-columns: 1fr; }
    .fila { grid-template-columns: 1fr 1fr; }
    .fila .fecha, .fila .nit { display: none; }
    .info-usuario span { display: none; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     PANTALLA DE AUTENTICACIÓN
════════════════════════════════════════════ -->
<div id="pantalla-auth">
  <div class="auth-caja">
    <div class="auth-logo">Facturas Cali</div>
    <div class="auth-sub">Sistema de gestión de facturas para PyMEs</div>

    <div class="auth-tabs">
      <button class="auth-tab activo" id="tab-login" onclick="mostrarTab('login')">Ingresar</button>
      <button class="auth-tab" id="tab-registro" onclick="mostrarTab('registro')">Registrarse</button>
    </div>

    <!-- Formulario login -->
    <div class="auth-form" id="form-login">
      <input type="text" id="login-usuario" placeholder="Nombre de usuario" autocomplete="username">
      <input type="password" id="login-contrasena" placeholder="Contraseña" autocomplete="current-password">
      <div class="auth-error" id="login-error"></div>
      <button class="btn-auth" id="btn-login" onclick="hacerLogin()">Ingresar</button>
    </div>

    <!-- Formulario registro -->
    <div class="auth-form" id="form-registro" style="display:none">
      <input type="text" id="reg-negocio" placeholder="Nombre del negocio (ej: Ferretería El Perno)">
      <input type="text" id="reg-usuario" placeholder="Nombre de usuario (sin espacios)">
      <input type="password" id="reg-contrasena" placeholder="Contraseña">
      <div class="auth-error" id="reg-error"></div>
      <button class="btn-auth" id="btn-registro" onclick="hacerRegistro()">Crear cuenta</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PANTALLA PRINCIPAL (APP)
════════════════════════════════════════════ -->
<div id="pantalla-app">
<div class="contenedor">

  <header>
    <div class="logo">Facturas Cali</div>
    <span class="version">v1.0.0</span>
    <div class="info-usuario">
      <span id="txt-negocio"></span>
      <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <!-- SUBIR FACTURA -->
  <div class="seccion">
    <div class="etiqueta">// Subir factura</div>

    <div class="zona-carga" id="zona">
      <input type="file" id="input-archivo" accept=".pdf,.jpg,.jpeg,.png,.webp">
      <span class="icono-carga">📄</span>
      <div class="texto-carga">
        <strong>Arrastra tu factura aquí</strong><br>
        o haz clic para seleccionar<br>
        PDF · JPG · PNG · WebP
      </div>
    </div>

    <div class="archivo-chip" id="chip-archivo">
      <span>📎</span>
      <span id="txt-archivo"></span>
    </div>

    <div class="fila-accion">
      <button class="btn-procesar" id="btn-procesar" disabled onclick="procesarFactura()">Procesar</button>
    </div>

    <div class="barra" id="barra"><div class="barra-inner"></div></div>
    <div class="error-msg" id="error-msg"></div>

    <div class="resultado" id="resultado">
      <div class="resultado-header">
        <span>Datos extraídos</span>
        <span class="badge ok">PROCESADO</span>
      </div>
      <div class="resultado-body" id="resultado-body"></div>
    </div>
  </div>

  <!-- LISTA FACTURAS -->
  <div class="seccion">
    <div class="cabecera-lista">
      <div class="etiqueta">// Mis facturas</div>
      <button class="btn-recargar" onclick="cargarFacturas()">↻ Recargar</button>
    </div>
    <div id="contenedor-lista"><div class="vacio">Cargando...</div></div>
  </div>

  <footer>
    <span>SaaS Facturas Cali — PyMEs Colombia</span>
    <span id="txt-hora"></span>
  </footer>

</div>
</div>

<script>
const API = 'https://saas-facturas-cali-production.up.railway.app';
let archivoActual = null;
let tokenSesion   = null;

// ─── Auth: tabs ──────────────────────────────
function mostrarTab(tab) {
  document.getElementById('form-login').style.display    = tab === 'login'    ? 'flex' : 'none';
  document.getElementById('form-registro').style.display = tab === 'registro' ? 'flex' : 'none';
  document.getElementById('tab-login').className    = 'auth-tab' + (tab === 'login'    ? ' activo' : '');
  document.getElementById('tab-registro').className = 'auth-tab' + (tab === 'registro' ? ' activo' : '');
}

// ─── Login ───────────────────────────────────
async function hacerLogin() {
  const usuario    = document.getElementById('login-usuario').value.trim();
  const contrasena = document.getElementById('login-contrasena').value;
  const errorEl    = document.getElementById('login-error');
  const btn        = document.getElementById('btn-login');

  if (!usuario || !contrasena) {
    errorEl.textContent = 'Completa todos los campos.';
    errorEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  errorEl.classList.remove('visible');

  try {
    const res  = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, contrasena })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || 'Error al ingresar');

    tokenSesion = data.token;
    localStorage.setItem('fc_token',   data.token);
    localStorage.setItem('fc_negocio', data.nombre_negocio);
    entrarApp(data.nombre_negocio);

  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}

// ─── Registro ────────────────────────────────
async function hacerRegistro() {
  const nombre_negocio = document.getElementById('reg-negocio').value.trim();
  const usuario        = document.getElementById('reg-usuario').value.trim();
  const contrasena     = document.getElementById('reg-contrasena').value;
  const errorEl        = document.getElementById('reg-error');
  const btn            = document.getElementById('btn-registro');

  if (!nombre_negocio || !usuario || !contrasena) {
    errorEl.textContent = 'Completa todos los campos.';
    errorEl.classList.add('visible');
    return;
  }

  if (usuario.includes(' ')) {
    errorEl.textContent = 'El usuario no puede tener espacios.';
    errorEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creando cuenta...';
  errorEl.classList.remove('visible');

  try {
    const res  = await fetch(`${API}/registro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, contrasena, nombre_negocio })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || 'Error al registrar');

    // Auto-login después del registro
    document.getElementById('login-usuario').value    = usuario;
    document.getElementById('login-contrasena').value = contrasena;
    mostrarTab('login');
    await hacerLogin();

  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crear cuenta';
  }
}

// ─── Entrar a la app ─────────────────────────
function entrarApp(nombreNegocio) {
  document.getElementById('pantalla-auth').style.display = 'none';
  document.getElementById('pantalla-app').style.display  = 'block';
  document.getElementById('txt-negocio').textContent     = nombreNegocio;
  document.getElementById('txt-hora').textContent =
    new Date().toLocaleString('es-CO', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
  cargarFacturas();
}

// ─── Cerrar sesión ───────────────────────────
async function cerrarSesion() {
  if (tokenSesion) {
    await fetch(`${API}/logout`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${tokenSesion}` }
    }).catch(() => {});
  }
  tokenSesion = null;
  localStorage.removeItem('fc_token');
  localStorage.removeItem('fc_negocio');
  document.getElementById('pantalla-auth').style.display = 'flex';
  document.getElementById('pantalla-app').style.display  = 'none';
  document.getElementById('login-usuario').value    = '';
  document.getElementById('login-contrasena').value = '';
}

// ─── Zona de carga ───────────────────────────
const zona = document.getElementById('zona');
const inputArchivo = document.getElementById('input-archivo');

zona.addEventListener('dragover',  e => { e.preventDefault(); zona.classList.add('arrastrar'); });
zona.addEventListener('dragleave', () => zona.classList.remove('arrastrar'));
zona.addEventListener('drop', e => {
  e.preventDefault();
  zona.classList.remove('arrastrar');
  if (e.dataTransfer.files[0]) seleccionar(e.dataTransfer.files[0]);
});
inputArchivo.addEventListener('change', e => {
  if (e.target.files[0]) seleccionar(e.target.files[0]);
});

function seleccionar(archivo) {
  archivoActual = archivo;
  document.getElementById('txt-archivo').textContent = archivo.name;
  document.getElementById('chip-archivo').classList.add('visible');
  document.getElementById('btn-procesar').disabled = false;
  document.getElementById('error-msg').classList.remove('visible');
  document.getElementById('resultado').classList.remove('visible');
}

// ─── Procesar factura ────────────────────────
async function procesarFactura() {
  if (!archivoActual || !tokenSesion) return;
  const btn = document.getElementById('btn-procesar');

  btn.disabled = true;
  btn.textContent = 'Procesando...';
  document.getElementById('barra').classList.add('visible');
  document.getElementById('error-msg').classList.remove('visible');
  document.getElementById('resultado').classList.remove('visible');

  const form = new FormData();
  form.append('archivo', archivoActual);

  try {
    const res  = await fetch(`${API}/facturas/subir`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${tokenSesion}` },
      body: form
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || 'Error procesando la factura');

    const d     = data.datos;
    const total = d.total ? `$${Number(d.total).toLocaleString('es-CO')}` : '—';
    const nitCl = d.nit_valido ? 'ok' : 'mal';
    const nitIc = d.nit_valido ? '✅' : '⚠️';

    document.getElementById('resultado-body').innerHTML = `
      <div class="dato">
        <label>Proveedor</label>
        <div class="val">${d.proveedor || '—'}</div>
      </div>
      <div class="dato">
        <label>NIT</label>
        <div class="val ${nitCl}">${nitIc} ${d.nit || '—'}</div>
      </div>
      <div class="dato">
        <label>Total COP</label>
        <div class="val total">${total}</div>
      </div>
      <div class="dato">
        <label>Fecha</label>
        <div class="val">${d.fecha || '—'}</div>
      </div>
      <div class="dato full">
        <label>ID guardado</label>
        <div class="val" style="font-size:11px;color:var(--texto-dim)">${data.id}</div>
      </div>
    `;
    document.getElementById('resultado').classList.add('visible');
    cargarFacturas();

  } catch (err) {
    const el = document.getElementById('error-msg');
    el.textContent = `❌ ${err.message}`;
    el.classList.add('visible');
  } finally {
    document.getElementById('barra').classList.remove('visible');
    btn.disabled = false;
    btn.textContent = 'Procesar';
  }
}

// ─── Listar facturas ─────────────────────────
async function cargarFacturas() {
  const c = document.getElementById('contenedor-lista');
  if (!tokenSesion) return;

  try {
    const res  = await fetch(`${API}/facturas?limite=20`, {
      headers: { 'Authorization': `Bearer ${tokenSesion}` }
    });
    const data = await res.json();

    if (!data.facturas?.length) {
      c.innerHTML = '<div class="vacio">Aún no hay facturas procesadas</div>';
      return;
    }

    const filas = data.facturas.map(f => {
      const total = f.total ? `$${Number(f.total).toLocaleString('es-CO')}` : '—';
      const fecha = f.fecha_procesado
        ? new Date(f.fecha_procesado).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' })
        : '—';
      return `
        <div class="fila">
          <div class="proveedor">${f.proveedor || f.archivo_original || '—'}</div>
          <div class="nit">${f.nit || '—'}</div>
          <div class="fecha">${fecha}</div>
          <div class="monto">${total}</div>
        </div>`;
    }).join('');

    c.innerHTML = `
      <div class="lista">
        <div class="fila cabecera">
          <div>Proveedor</div><div>NIT</div><div>Fecha</div>
          <div style="text-align:right">Total</div>
        </div>
        ${filas}
      </div>`;

  } catch {
    c.innerHTML = '<div class="vacio">Error cargando facturas</div>';
  }
}

// ─── Init: revisar sesión guardada ───────────
const tokenGuardado  = localStorage.getItem('fc_token');
const negocioGuardado = localStorage.getItem('fc_negocio');

if (tokenGuardado && negocioGuardado) {
  tokenSesion = tokenGuardado;
  entrarApp(negocioGuardado);
}

// Enter en login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').style.display !== 'none') hacerLogin();
    else hacerRegistro();
  }
});
